# project.yml — XcodeGen spec for the LANyard iPhone app.
#
# WRITTEN, NOT COMPILED and NOT RUN here: this Linux box has no XcodeGen or
# Xcode. On a Mac:
#
#     brew install xcodegen
#     cd ios && xcodegen generate && open Lanyard.xcodeproj
#
# It references the local SwiftPM package (this directory) and produces two
# targets: the app (LanyardApp) and the Phase 6 share extension
# (LanyardShareExtension). Both app and extension link the package products
# LanyardCore and LanyardNet; the extension also embeds into the app.

name: Lanyard

options:
  bundleIdPrefix: io.github.tuscani712.lanyard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# The local package declared by Package.swift in this directory.
packages:
  LanyardPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  # The SwiftUI app. Sources are in LanyardApp/ (outside the SwiftPM targets, so
  # they are not part of `swift build`).
  LanyardApp:
    type: application
    platform: iOS
    sources:
      - path: LanyardApp
        excludes:
          - Info.plist
    info:
      path: LanyardApp/Info.plist
    dependencies:
      - package: LanyardPackage
        product: LanyardCore
      - package: LanyardPackage
        product: LanyardNet
      - target: LanyardShareExtension
        embed: true
    # ── Entitlements need an Apple developer team ─────────────────────────────
    # App Groups (below) are only honored when both the app and the extension
    # are signed with the same Team ID and the group is registered on the
    # developer portal. Without a team / provisioning profile, the extension's
    # `containerURL(forSecurityApplicationGroupIdentifier:)` returns nil.
    # Keychain sharing (`keychain-access-groups`) and iCloud would need the same
    # team setup and are deliberately not declared here.
    entitlements:
      path: LanyardApp/LanyardApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.tuscani712.lanyard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tuscani712.lanyard
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"

  # Phase 6 share extension: accepts files, URLs and text; spools them into the
  # App Group container, then hands off to the app.
  LanyardShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LanyardShareExtension
        excludes:
          - Info.plist
    info:
      path: LanyardShareExtension/Info.plist
    dependencies:
      - package: LanyardPackage
        product: LanyardCore
      - package: LanyardPackage
        product: LanyardNet
    # Same App Group as the app so the spooled files are readable across the
    # boundary. Requires the same Team ID / provisioning profile as the app.
    entitlements:
      path: LanyardShareExtension/LanyardShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.tuscani712.lanyard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tuscani712.lanyard.share
        GENERATE_INFOPLIST_FILE: false
